<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E5631" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3D230D" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Brocade Stripe Accent -->
  <rect x="0" y="0" width="800" height="8" fill="#8B261D"/>
  
  <!-- Decorative Mountains -->
  <path d="M150 380 L350 200 L550 380 Z" fill="url(#mountainGrad)"/>
  <path d="M300 380 L480 240 L660 380 Z" fill="url(#mountainGrad)" opacity="0.7"/>
  
  <!-- Sun -->
  <circle cx="480" cy="180" r="36" fill="#E5A93C" opacity="0.8"/>
  
  <!-- Center Card Frame -->
  <rect x="250" y="140" width="300" height="220" rx="16" fill="#FFFFFF" opacity="0.9" stroke="#8B261D" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Camera / Image Icon -->
  <g transform="translate(370, 180)">
    <path d="M12 9 C9.79 9 8 10.79 8 13 L8 31 C8 33.21 9.79 35 12 35 L48 35 C50.21 35 52 33.21 52 31 L52 13 C52 10.79 50.21 9 48 9 L42 9 L38 4 L22 4 L18 9 L12 9 Z M30 31 C23.37 31 18 25.63 18 19 C18 12.37 23.37 7 30 7 C36.63 7 42 12.37 42 19 C42 25.63 36.63 31 30 31 Z" fill="#8B261D"/>
    <circle cx="30" cy="19" r="8" fill="#E5A93C"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="275" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#3D230D" text-anchor="middle">Đắk Lắk Travel AI</text>
  <text x="400" y="305" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#8B261D" text-anchor="middle">🖼️ Hình ảnh đang được cập nhật</text>
</svg>
